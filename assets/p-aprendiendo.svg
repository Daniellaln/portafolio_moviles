<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 322" width="900" height="322" role="img" aria-label="Lo que voy aprendiendo">
<defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDE0F0"/><stop offset="55%" stop-color="#EFD9FA"/><stop offset="100%" stop-color="#DDC3F7"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.60"/>
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.45"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.25"/></linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="20"/></filter>
  </defs>
  <clipPath id="c"><rect width="900" height="322" rx="26"/></clipPath>
  <g clip-path="url(#c)">
    <rect width="900" height="322" fill="url(#bg)"/>
    <g filter="url(#soft)">
      <circle cx="90" cy="30" r="62" fill="#FFB8DC" opacity="0.55">
        <animate attributeName="cy" values="30;70;30" dur="9s" repeatCount="indefinite"/></circle>
      <circle cx="820" cy="292" r="70" fill="#B79CF2" opacity="0.5">
        <animate attributeName="cx" values="820;750;820" dur="11s" repeatCount="indefinite"/></circle>
    </g>
    <rect x="16" y="16" width="868" height="290" rx="22" fill="url(#glass)"/>
    <rect x="16" y="16" width="868" height="290" rx="22" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
    <rect x="-200" y="16" width="140" height="290" fill="url(#shine)" transform="skewX(-16)">
      <animate attributeName="x" values="-200;1010;-200" dur="7s" repeatCount="indefinite"/></rect>
    <text x="450.0" y="78" text-anchor="middle" font-family="Georgia, serif"
          font-size="30" font-weight="bold" fill="#5B3F94" letter-spacing="1.2">Lo que voy aprendiendo</text>
    <text x="450.0" y="132" text-anchor="middle" font-family="Verdana, sans-serif" font-size="16" font-weight="normal" fill="#7157A8">Estados con remember y mutableStateOf</text><text x="450.0" y="166" text-anchor="middle" font-family="Verdana, sans-serif" font-size="16" font-weight="normal" fill="#7157A8">Controles: Slider, Switch, Checkbox, TextField</text><text x="450.0" y="200" text-anchor="middle" font-family="Verdana, sans-serif" font-size="16" font-weight="normal" fill="#7157A8">Layouts con Column, Row y Box</text><text x="450.0" y="234" text-anchor="middle" font-family="Verdana, sans-serif" font-size="16" font-weight="normal" fill="#7157A8">Material 3: temas, colores y tipografia</text><text x="450.0" y="268" text-anchor="middle" font-family="Verdana, sans-serif" font-size="16" font-weight="normal" fill="#7157A8">Separar la logica de negocio de la interfaz</text><text x="450.0" y="302" text-anchor="middle" font-family="Verdana, sans-serif" font-size="16" font-weight="normal" fill="#7157A8">Pruebas unitarias con JUnit</text>
    <path d="M56 52 l2.7 8 8 2.7 -8 2.7 -2.7 8 -2.7 -8 -8 -2.7 8 -2.7z" fill="#FFF"><animate attributeName="opacity" values="0.25;1;0.25" dur="3.0s" repeatCount="indefinite"/></path>
    <path d="M836 258 l2.4 7 7 2.4 -7 2.4 -2.4 7 -2.4 -7 -7 -2.4 7 -2.4z" fill="#FFF"><animate attributeName="opacity" values="1;0.2;1" dur="3.8s" repeatCount="indefinite"/></path>
  </g>
</svg>