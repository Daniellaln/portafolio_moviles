<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 110" width="900" height="110" role="img" aria-label="Sobre este portafolio">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFE3F1"/><stop offset="55%" stop-color="#F0DAFA"/><stop offset="100%" stop-color="#D8C2F8"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.60"/>
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="22"/></filter>
  </defs>

  <clipPath id="c"><rect width="900" height="110" rx="55"/></clipPath>
  <g clip-path="url(#c)">
    <rect width="900" height="110" fill="url(#bg)"/>
    <g filter="url(#soft)">
      <circle cx="90" cy="20" r="55" fill="#FFB8DC" opacity="0.6">
        <animate attributeName="cy" values="20;60;20" dur="8s" repeatCount="indefinite"/></circle>
      <circle cx="810" cy="95" r="60" fill="#B79CF2" opacity="0.55">
        <animate attributeName="cx" values="810;740;810" dur="10s" repeatCount="indefinite"/></circle>
    </g>
    <rect x="14" y="14" width="872" height="82" rx="41" fill="url(#glass)"/>
    <rect x="14" y="14" width="872" height="82" rx="41" fill="none" stroke="url(#edge)" stroke-width="1.6"/>
    <rect x="-200" y="14" width="150" height="82" fill="url(#shine)" transform="skewX(-16)">
      <animate attributeName="x" values="-200;1020;-200" dur="6s" repeatCount="indefinite"/></rect>
    <text x="450.0" y="66.0" text-anchor="middle" font-family="Georgia, serif"
          font-size="34" font-weight="bold" fill="#63479B" letter-spacing="2">Sobre este portafolio</text>
    <path d="M52 39.0 l2.7 8 8 2.7 -8 2.7 -2.7 8 -2.7 -8 -8 -2.7 8 -2.7z" fill="#FFF"><animate attributeName="opacity" values="0.25;1;0.25" dur="2.8s" repeatCount="indefinite"/></path>
    <path d="M836 41.0 l2.4 7 7 2.4 -7 2.4 -2.4 7 -2.4 -7 -7 -2.4 7 -2.4z" fill="#FFF"><animate attributeName="opacity" values="1;0.2;1" dur="3.6s" repeatCount="indefinite"/></path>
  </g>
</svg>