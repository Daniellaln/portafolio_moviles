<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-label="Daniella Leon Andres - Programacion en Moviles" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#FFE3F1"/>
      <stop offset="35%"  stop-color="#F6DDF9"/>
      <stop offset="70%"  stop-color="#E3D0FA"/>
      <stop offset="100%" stop-color="#CDB4F6"/>
    </linearGradient>

    <linearGradient id="vidrio" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="50%"  stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.42"/>
    </linearGradient>

    <linearGradient id="brillo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#FFFFFF" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="borde" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.25"/>
    </linearGradient>

    <filter id="blur30"><feGaussianBlur stdDeviation="30"/></filter>
    <filter id="blur12"><feGaussianBlur stdDeviation="12"/></filter>

    <clipPath id="marco"><rect width="1000" height="320" rx="26"/></clipPath>
    <clipPath id="clipVidrio"><rect x="130" y="72" width="740" height="176" rx="30"/></clipPath>
  </defs>

  <g clip-path="url(#marco)">
    <rect width="1000" height="320" fill="url(#fondo)"/>

    <!-- burbujas de fondo desenfocadas -->
    <g filter="url(#blur30)">
      <circle cx="140" cy="90" r="80" fill="#FFB8DC" opacity="0.55">
        <animate attributeName="cy" values="90;130;90" dur="9s" repeatCount="indefinite"/>
      </circle>
      <circle cx="850" cy="240" r="95" fill="#B79CF2" opacity="0.5">
        <animate attributeName="cy" values="240;196;240" dur="11s" repeatCount="indefinite"/>
      </circle>
      <circle cx="520" cy="40" r="70" fill="#FFD1E8" opacity="0.6">
        <animate attributeName="cx" values="520;600;520" dur="13s" repeatCount="indefinite"/>
      </circle>
      <circle cx="300" cy="280" r="60" fill="#C9AEF5" opacity="0.45">
        <animate attributeName="cx" values="300;230;300" dur="10s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- panel de vidrio -->
    <g>
      <rect x="130" y="72" width="740" height="176" rx="30" fill="url(#vidrio)"/>
      <rect x="130" y="72" width="740" height="176" rx="30" fill="none" stroke="url(#borde)" stroke-width="1.6"/>
      <!-- barrido de brillo -->
      <g clip-path="url(#clipVidrio)">
        <rect x="-260" y="72" width="200" height="176" fill="url(#brillo)" transform="skewX(-18)">
          <animate attributeName="x" values="-260;1060;-260" dur="7s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>

    <!-- texto -->
    <text x="500" y="140" text-anchor="middle" font-family="Georgia, 'Segoe UI', serif"
          font-size="46" font-weight="bold" fill="#63479B" letter-spacing="1.5">
      Daniella Leon Andres
    </text>
    <text x="500" y="180" text-anchor="middle" font-family="'Segoe UI', Verdana, sans-serif"
          font-size="18" fill="#8A6FC0" letter-spacing="4">
      PROGRAMACION EN MOVILES
    </text>
    <text x="500" y="208" text-anchor="middle" font-family="'Segoe UI', Verdana, sans-serif"
          font-size="13" fill="#A08AD0" letter-spacing="2">
      Tecsup &#183; Kotlin &#183; Jetpack Compose
    </text>
    <text x="500" y="234" text-anchor="middle" font-family="'Segoe UI', Verdana, sans-serif"
          font-size="14" fill="#7C63B4">
      Todos los trabajos del curso, una carpeta por semana
    </text>

    <!-- destellos -->
    <g fill="#FFFFFF">
      <path d="M205 60 l4 11 11 4 -11 4 -4 11 -4 -11 -11 -4 11 -4z" opacity="0.9">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="2.6s" repeatCount="indefinite"/>
      </path>
      <path d="M800 88 l3.5 9.5 9.5 3.5 -9.5 3.5 -3.5 9.5 -3.5 -9.5 -9.5 -3.5 9.5 -3.5z" opacity="0.85">
        <animate attributeName="opacity" values="1;0.15;1" dur="3.4s" repeatCount="indefinite"/>
      </path>
      <path d="M120 250 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z" opacity="0.8">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="4.1s" repeatCount="indefinite"/>
      </path>
      <path d="M905 150 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z" opacity="0.75">
        <animate attributeName="opacity" values="1;0.2;1" dur="2.9s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>
</svg>
