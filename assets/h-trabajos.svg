<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 64" width="560" height="64" role="img" aria-label="Trabajos del ciclo">
<defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFE3F1"/><stop offset="55%" stop-color="#F0DAFA"/><stop offset="100%" stop-color="#D8C2F8"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.60"/>
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.45"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.25"/></linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="20"/></filter>
  </defs>
  <clipPath id="c"><rect width="560" height="64" rx="32"/></clipPath>
  <g clip-path="url(#c)">
    <rect width="560" height="64" fill="url(#bg)"/>
    <g filter="url(#soft)">
      <circle cx="60" cy="10" r="34" fill="#FFB8DC" opacity="0.65">
        <animate attributeName="cy" values="10;38;10" dur="8s" repeatCount="indefinite"/></circle>
      <circle cx="500" cy="58" r="38" fill="#B79CF2" opacity="0.6">
        <animate attributeName="cx" values="500;450;500" dur="10s" repeatCount="indefinite"/></circle>
    </g>
    <rect x="8" y="8" width="544" height="48" rx="24" fill="url(#glass)"/>
    <rect x="8" y="8" width="544" height="48" rx="24" fill="none" stroke="url(#edge)" stroke-width="1.3"/>
    <rect x="-130" y="8" width="95" height="48" fill="url(#shine)" transform="skewX(-16)">
      <animate attributeName="x" values="-130;640;-130" dur="6s" repeatCount="indefinite"/></rect>
    <text x="280.0" y="40.0" text-anchor="middle" font-family="Georgia, serif"
          font-size="24" font-weight="bold" fill="#63479B" letter-spacing="1.5">Trabajos del ciclo</text>
    <path d="M30 23.0 l2.0 6 6 2.0 -6 2.0 -2.0 6 -2.0 -6 -6 -2.0 6 -2.0z" fill="#FFF"><animate attributeName="opacity" values="0.25;1;0.25" dur="2.9s" repeatCount="indefinite"/></path>
    <path d="M522 24.0 l1.7 5 5 1.7 -5 1.7 -1.7 5 -1.7 -5 -5 -1.7 5 -1.7z" fill="#FFF"><animate attributeName="opacity" values="1;0.2;1" dur="3.7s" repeatCount="indefinite"/></path>
  </g>
</svg>