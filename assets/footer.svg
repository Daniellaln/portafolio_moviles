<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" width="1000" height="200" role="img" aria-label="Gracias por pasar. Daniella Leon Andres, Diseno y Desarrollo de Software, Tecsup">
  <defs>
    <linearGradient id="bg" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFE3F1"/><stop offset="45%" stop-color="#F0DAFA"/>
      <stop offset="100%" stop-color="#CDB4F6"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.42"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.25"/></linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="26"/></filter>
    <clipPath id="c"><rect width="1000" height="200" rx="26"/></clipPath>
    <clipPath id="cg"><rect x="150" y="30" width="700" height="140" rx="26"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="1000" height="200" fill="url(#bg)"/>
    <g filter="url(#soft)">
      <circle cx="150" cy="170" r="75" fill="#FFB8DC" opacity="0.55">
        <animate attributeName="cy" values="170;130;170" dur="9s" repeatCount="indefinite"/></circle>
      <circle cx="850" cy="40" r="80" fill="#B79CF2" opacity="0.5">
        <animate attributeName="cx" values="850;770;850" dur="12s" repeatCount="indefinite"/></circle>
    </g>
    <rect x="150" y="30" width="700" height="140" rx="26" fill="url(#glass)"/>
    <rect x="150" y="30" width="700" height="140" rx="26" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
    <g clip-path="url(#cg)">
      <rect x="-240" y="30" width="170" height="140" fill="url(#shine)" transform="skewX(-18)">
        <animate attributeName="x" values="-240;1080;-240" dur="7s" repeatCount="indefinite"/></rect>
    </g>
    <text x="500" y="82" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#8A6FC0" letter-spacing="2">Gracias por pasar</text>
    <text x="500" y="124" text-anchor="middle" font-family="Georgia, serif" font-size="30" font-weight="bold" fill="#5B3F94">Daniella Leon Andres</text>
    <text x="500" y="150" text-anchor="middle" font-family="Verdana, sans-serif" font-size="12.5" fill="#8A6FC0" letter-spacing="1.5">Diseno y Desarrollo de Software &#183; Tecsup</text>
    <path d="M215 60 l3.4 9.5 9.5 3.4 -9.5 3.4 -3.4 9.5 -3.4 -9.5 -9.5 -3.4 9.5 -3.4z" fill="#FFF">
      <animate attributeName="opacity" values="0.25;1;0.25" dur="3.1s" repeatCount="indefinite"/></path>
    <path d="M790 128 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z" fill="#FFF">
      <animate attributeName="opacity" values="1;0.2;1" dur="3.9s" repeatCount="indefinite"/></path>
  </g>
</svg>